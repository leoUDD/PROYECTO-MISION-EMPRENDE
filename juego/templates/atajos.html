<style>
  .next-step {
    width: min(90%, 430px) !important;
    min-height: 120px !important;
    margin-left: auto !important;
    margin-right: auto !important;
    padding: 18px 22px !important;
    border-radius: 22px !important;
    background:
      linear-gradient(180deg, rgba(8, 26, 45, .94), rgba(3, 16, 32, .96)) !important;
    border: 2px solid rgba(174, 235, 255, .75) !important;
    box-shadow:
      0 0 22px rgba(0, 200, 255, .28),
      inset 0 0 0 1px rgba(255,255,255,.08) !important;
    backdrop-filter: blur(10px) !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 12px !important;
    text-align: center !important;
    position: relative;
    z-index: 8;
  }

  .next-step::before {
    content: var(--atajos-punto-control, "PUNTO DE CONTROL");
    color: #AEEBFF;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .16em;
    opacity: .9;
    text-shadow: 0 0 8px rgba(0, 200, 255, .55);
  }

  .next-step button,
  .next-step .btn,
  .next-step .btn-chip {
    min-width: 210px !important;
  }

  @media (max-width: 700px) {
    .next-step {
      width: min(92%, 360px) !important;
      min-height: 105px !important;
      padding: 14px 16px !important;
      border-radius: 18px !important;
    }

    .next-step::before {
      font-size: 9px;
    }
  }

  /* Reflexión final: las preguntas son contenido para conversar,
     no controles interactivos. Este selector solo existe en reflexion.html. */
  .reflection-prompts {
    counter-reset: reflexion-pregunta;
    gap: 0 !important;
    margin-top: 24px !important;
    border-top: 1px solid rgba(0, 200, 255, .18);
  }

  .reflection-prompts li {
    counter-increment: reflexion-pregunta;
    position: relative;
    padding: 17px 8px 17px 54px !important;
    border: 0 !important;
    border-bottom: 1px solid rgba(0, 200, 255, .14) !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    color: #E6EEF8 !important;
    cursor: default !important;
    transition: none !important;
  }

  .reflection-prompts li::before {
    content: counter(reflexion-pregunta, decimal-leading-zero) !important;
    position: absolute !important;
    left: 8px !important;
    top: 18px !important;
    transform: none !important;
    color: #00FC98 !important;
    font-size: 11px !important;
    font-weight: 900 !important;
    letter-spacing: .08em;
    text-shadow: 0 0 9px rgba(0, 242, 109, .38) !important;
  }

  .reflection-prompts li:hover {
    transform: none !important;
    background: transparent !important;
    border-color: rgba(0, 200, 255, .14) !important;
  }

  @media (max-width: 700px) {
    .reflection-prompts li {
      padding: 15px 4px 15px 46px !important;
    }

    .reflection-prompts li::before {
      left: 4px !important;
      top: 16px !important;
    }
  }
</style>

<script>
  function tAtajos(clave, fallback) {
    try {
      const idioma = window.i18nJuego?.obtenerIdioma?.() || "es";
      return window.i18nJuego?.traducciones?.[idioma]?.[clave] || fallback;
    } catch (e) {
      return fallback;
    }
  }

  function aplicarTraduccionAtajos() {
    const texto = tAtajos("atajos_punto_control", "PUNTO DE CONTROL");
    document.querySelectorAll(".next-step").forEach(el => {
      el.style.setProperty("--atajos-punto-control", `"${texto}"`);
    });
  }

  function aplicarAjustesReflexionFinal() {
    const qrHint = document.querySelector(".card-instagram .qr-hint");
    if (!qrHint) return;

    const idioma = window.i18nJuego?.obtenerIdioma?.() || "es";
    qrHint.textContent = idioma === "en"
      ? "Scan this QR and follow us on social media, or find us as @emprendimiento.udd."
      : "Escanea este QR y síguenos en nuestras RRSS, o búscanos como @emprendimiento.udd.";
  }

  document.addEventListener("DOMContentLoaded", () => {
    aplicarTraduccionAtajos();
    aplicarAjustesReflexionFinal();
  });

  window.addEventListener("idiomaJuegoCambiado", () => {
    aplicarTraduccionAtajos();
    aplicarAjustesReflexionFinal();
  });
</script>
