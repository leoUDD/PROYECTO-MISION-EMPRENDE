{% comment %}
LINEA PROGRESO HABILIDADES
Panel lateral de misión.
{% endcomment %}

<div class="metro-progreso-habilidades" id="metroProgresoHabilidades">
  <div class="metro-header">
    <span class="metro-header-icon">◆</span>
    <span data-i18n="mapa_ruta_mision">Ruta de misión</span>
  </div>

  <div class="metro-linea-base"></div>
  <div class="metro-linea-activa" id="metroLineaActiva"></div>

  <div
    class="metro-punto"
    data-fases="bienvenida,inicio,pantalla_inicio,conocidos,trabajoenequipo,minijuego1,sopa"
    data-index="0"
  >
    <span class="metro-circulo">1</span>
    <small data-i18n="mapa_trabajo_equipo_html">Trabajo<br>en equipo</small>
  </div>

  <div
    class="metro-punto"
    data-fases="transicion,transiciondesafio,desafios,tematicas,espera_eleccion,bubblemap,empatia,transicionempatia"
    data-index="1"
  >
    <span class="metro-circulo">2</span>
    <small data-i18n="mapa_empatia">Empatía</small>
  </div>

  <div
    class="metro-punto"
    data-fases="creatividad,transicioncreatividad,lego"
    data-index="2"
  >
    <span class="metro-circulo">3</span>
    <small data-i18n="mapa_creatividad">Creatividad</small>
  </div>

  <div
    class="metro-punto"
    data-fases="comunicacion,transicioncomunicacion,pitch,orden_presentacion,presentar_pitch,apoyo,transicionapoyo,peer-review,peer_review,peerreview,peer-review-form,peer_review_form,evaluacion,evaluacion-pitch,evaluacion_pitch,mision_cumplida,ranking,reflexion"
    data-index="3"
  >
    <span class="metro-circulo">4</span>
    <small data-i18n="mapa_comunicacion">Comunicación</small>
  </div>
</div>

<style>
  :root {
    --metro-bg: rgba(5, 17, 36, .93);
    --metro-bg-strong: rgba(3, 12, 28, .97);

    --metro-blue: #00C8FF;
    --metro-blue-soft: #5BE7FF;
    --metro-green: #00FF88;
    --metro-green-soft: #26FFC2;

    --metro-text: #E6EEF8;
    --metro-muted: #AAB7C8;

    --metro-border-blue: rgba(0, 200, 255, .45);
    --metro-border-green: rgba(0, 255, 136, .55);

    --metro-glow-blue: rgba(0, 200, 255, .35);
    --metro-glow-green: rgba(0, 255, 136, .38);
  }

  .metro-progreso-habilidades {
    position: fixed;
    top: 50%;
    left: 22px;
    transform: translateY(-50%);
    width: 122px;
    min-height: 480px;
    padding: 18px 10px 22px;
    border-radius: 30px;
    background:
      radial-gradient(circle at top, rgba(0, 255, 136, .20), transparent 32%),
      radial-gradient(circle at bottom, rgba(0, 200, 255, .18), transparent 36%),
      linear-gradient(180deg, var(--metro-bg), var(--metro-bg-strong));
    border: 2px solid var(--metro-border-blue);
    box-shadow:
      0 0 26px rgba(0, 200, 255, .22),
      0 18px 36px rgba(0, 0, 0, .36),
      inset 0 0 0 1px rgba(255, 255, 255, .08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 9998;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    font-family: "Poppins", Arial, sans-serif;
  }

  .metro-progreso-habilidades::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 24px;
    border: 1px solid rgba(0, 255, 136, .12);
    pointer-events: none;
    box-shadow:
      inset 0 0 20px rgba(0, 200, 255, .08),
      inset 0 0 18px rgba(0, 255, 136, .06);
  }

  .metro-header {
    position: relative;
    z-index: 2;
    color: var(--metro-blue-soft);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.2;
    text-shadow: 0 0 10px rgba(0, 200, 255, .7);
    margin-bottom: 4px;
  }

  .metro-header-icon {
    display: block;
    color: var(--metro-green);
    font-size: 14px;
    margin-bottom: 2px;
    text-shadow:
      0 0 8px rgba(0, 255, 136, .75),
      0 0 14px rgba(0, 200, 255, .35);
  }

  .metro-linea-base,
  .metro-linea-activa {
    position: absolute;
    top: 86px;
    bottom: 46px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    border-radius: 999px;
    pointer-events: none;
  }

  .metro-linea-base {
    background: rgba(174, 235, 255, .16);
    box-shadow:
      inset 0 0 8px rgba(0, 0, 0, .55),
      0 0 12px rgba(0, 200, 255, .10);
  }

  .metro-linea-activa {
    height: 0%;
    bottom: auto;
    background:
      linear-gradient(
        180deg,
        var(--metro-blue),
        var(--metro-green-soft),
        var(--metro-green)
      );
    background-size: 100% 220%;
    box-shadow:
      0 0 14px rgba(0, 200, 255, .75),
      0 0 22px rgba(0, 255, 136, .45);
    transition: height .75s cubic-bezier(.18, .9, .25, 1);
    overflow: visible;
    animation: metroFlujoEnergia 2.2s linear infinite;
  }

  .metro-linea-activa::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--metro-green);
    opacity: 0;
    box-shadow:
      0 0 12px rgba(0, 255, 136, .85),
      0 0 24px rgba(0, 200, 255, .55);
  }

  .metro-progreso-habilidades.animando .metro-linea-activa::after {
    opacity: 1;
    animation: metroPulsoEnergia 1s ease-out 2;
  }

  .metro-punto {
    position: relative;
    z-index: 2;
    text-align: center;
    color: var(--metro-muted);
    width: 100%;
  }

  .metro-circulo {
    position: relative;
    width: 42px;
    height: 42px;
    margin: 0 auto 6px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 25%, rgba(91, 231, 255, .15), transparent 35%),
      #061326;
    border: 3px solid rgba(174, 235, 255, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--metro-text);
    font-weight: 900;
    box-sizing: border-box;
    transition:
      transform .28s ease,
      background .28s ease,
      border-color .28s ease,
      color .28s ease,
      box-shadow .28s ease;
    box-shadow:
      0 0 10px rgba(0, 200, 255, .18),
      inset 0 0 10px rgba(0, 200, 255, .12);
  }

  .metro-circulo::before,
  .metro-circulo::after {
    content: "";
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
  }

  .metro-circulo::before {
    border: 1px solid rgba(0, 255, 136, .55);
    box-shadow:
      0 0 12px rgba(0, 255, 136, .55),
      inset 0 0 12px rgba(0, 200, 255, .22);
  }

  .metro-circulo::after {
    background:
      radial-gradient(circle at 15% 25%, var(--metro-green) 0 2px, transparent 3px),
      radial-gradient(circle at 85% 20%, var(--metro-blue-soft) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 82%, var(--metro-green-soft) 0 2px, transparent 3px),
      radial-gradient(circle at 18% 78%, var(--metro-blue) 0 2px, transparent 3px);
    filter: drop-shadow(0 0 6px rgba(0, 255, 136, .75));
  }

  .metro-punto small {
    display: block;
    font-size: 10px;
    font-weight: 800;
    line-height: 1.1;
  }

  .metro-punto.completado .metro-circulo {
    background:
      radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .28), transparent 34%),
      linear-gradient(135deg, var(--metro-blue), var(--metro-green-soft));
    border-color: rgba(230, 255, 248, .85);
    color: #00101C;
    box-shadow:
      0 0 16px rgba(0, 200, 255, .65),
      0 0 22px rgba(0, 255, 136, .35);
  }

  .metro-punto.completado small {
    color: rgba(230, 238, 248, .82);
  }

  .metro-punto.activo .metro-circulo {
    background:
      radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .32), transparent 34%),
      linear-gradient(135deg, var(--metro-green), var(--metro-blue-soft));
    border-color: rgba(230, 255, 248, .95);
    color: #00101C;
    transform: scale(1.12);
    box-shadow:
      0 0 0 8px rgba(0, 255, 136, .16),
      0 0 20px rgba(0, 255, 136, .78),
      0 0 34px rgba(0, 200, 255, .45);
  }

  .metro-punto.activo small {
    color: #FFFFFF;
    text-shadow:
      0 0 8px rgba(0, 255, 136, .65),
      0 0 12px rgba(0, 200, 255, .35);
  }

  .metro-punto.animando .metro-circulo {
    animation: metroActivarCirculo 1.15s cubic-bezier(.16, 1, .3, 1);
  }

  .metro-punto.animando .metro-circulo::before {
    animation: metroOndaCircular 1.15s ease-out;
  }

  .metro-punto.animando .metro-circulo::after {
    animation: metroDestellos 1.15s ease-out;
  }

  @keyframes metroFlujoEnergia {
    0% {
      background-position: 0% 0%;
    }

    100% {
      background-position: 0% 220%;
    }
  }

  @keyframes metroPulsoEnergia {
    0% {
      transform: translateX(-50%) scale(.6);
      opacity: 0;
    }

    35% {
      transform: translateX(-50%) scale(1.25);
      opacity: 1;
    }

    100% {
      transform: translateX(-50%) scale(.9);
      opacity: 0;
    }
  }

  @keyframes metroActivarCirculo {
    0% {
      transform: scale(.95);
      filter: brightness(1);
    }

    28% {
      transform: scale(1.34);
      filter: brightness(1.45);
    }

    54% {
      transform: scale(1.02);
      filter: brightness(1.12);
    }

    76% {
      transform: scale(1.20);
      filter: brightness(1.28);
    }

    100% {
      transform: scale(1.12);
      filter: brightness(1);
    }
  }

  @keyframes metroOndaCircular {
    0% {
      opacity: 0;
      transform: scale(.55);
    }

    30% {
      opacity: 1;
      transform: scale(1);
    }

    100% {
      opacity: 0;
      transform: scale(1.75);
    }
  }

  @keyframes metroDestellos {
    0% {
      opacity: 0;
      transform: scale(.45) rotate(0deg);
    }

    24% {
      opacity: 1;
      transform: scale(1.05) rotate(30deg);
    }

    62% {
      opacity: .9;
      transform: scale(1.38) rotate(95deg);
    }

    100% {
      opacity: 0;
      transform: scale(1.72) rotate(150deg);
    }
  }

  @media (max-width: 1100px) {
    .metro-progreso-habilidades {
      left: 10px;
      width: 86px;
      min-height: 390px;
      padding: 14px 8px 18px;
    }

    .metro-header span:last-child {
      display: none;
    }

    .metro-linea-base,
    .metro-linea-activa {
      top: 64px;
      bottom: 34px;
    }

    .metro-circulo {
      width: 34px;
      height: 34px;
      font-size: 13px;
    }

    .metro-punto small {
      display: none;
    }
  }

  @media (max-width: 700px) {
    .metro-progreso-habilidades {
      top: auto;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94vw;
      min-height: auto;
      height: 72px;
      padding: 10px 16px;
      border-radius: 999px;
      flex-direction: row;
    }

    .metro-progreso-habilidades::before {
      inset: 6px;
      border-radius: 999px;
    }

    .metro-header {
      display: none;
    }

    .metro-linea-base,
    .metro-linea-activa {
      top: 50%;
      bottom: auto;
      left: 36px;
      right: 36px;
      transform: translateY(-50%);
      width: auto;
      height: 6px;
    }

    .metro-linea-activa {
      width: 0%;
      height: 6px;
      right: auto;
      background:
        linear-gradient(
          90deg,
          var(--metro-blue),
          var(--metro-green-soft),
          var(--metro-green)
        );
      background-size: 220% 100%;
      transition: width .75s cubic-bezier(.18, .9, .25, 1);
      animation: metroFlujoEnergiaHorizontal 2.2s linear infinite;
    }

    .metro-linea-activa::after {
      left: auto;
      right: -7px;
      bottom: 50%;
      transform: translateY(50%);
    }

    .metro-progreso-habilidades.animando .metro-linea-activa::after {
      animation: metroPulsoEnergiaHorizontal 1s ease-out 2;
    }

    .metro-circulo {
      width: 32px;
      height: 32px;
      font-size: 12px;
      margin-bottom: 0;
      border-width: 2px;
    }

    .metro-punto small {
      display: none;
    }

    .metro-punto.activo .metro-circulo {
      transform: scale(1.10);
    }

    @keyframes metroFlujoEnergiaHorizontal {
      0% {
        background-position: 0% 0%;
      }

      100% {
        background-position: 220% 0%;
      }
    }

    @keyframes metroPulsoEnergiaHorizontal {
      0% {
        transform: translateY(50%) scale(.6);
        opacity: 0;
      }

      35% {
        transform: translateY(50%) scale(1.25);
        opacity: 1;
      }

      100% {
        transform: translateY(50%) scale(.9);
        opacity: 0;
      }
    }

    @keyframes metroActivarCirculo {
      0% {
        transform: scale(.95);
        filter: brightness(1);
      }

      28% {
        transform: scale(1.25);
        filter: brightness(1.45);
      }

      54% {
        transform: scale(1.02);
        filter: brightness(1.12);
      }

      76% {
        transform: scale(1.14);
        filter: brightness(1.28);
      }

      100% {
        transform: scale(1.10);
        filter: brightness(1);
      }
    }
  }

  @media (max-width: 420px) {
    .metro-progreso-habilidades {
      width: calc(100vw - 16px);
      bottom: 8px;
      height: 64px;
      padding: 8px 12px;
    }

    .metro-linea-base,
    .metro-linea-activa {
      left: 28px;
      right: 28px;
      height: 5px;
    }

    .metro-linea-activa {
      height: 5px;
    }

    .metro-circulo {
      width: 28px;
      height: 28px;
      font-size: 11px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .metro-linea-activa,
    .metro-punto.animando .metro-circulo,
    .metro-punto.animando .metro-circulo::before,
    .metro-punto.animando .metro-circulo::after,
    .metro-progreso-habilidades.animando .metro-linea-activa::after {
      animation: none !important;
      transition: none !important;
    }
  }

  /*
 * Evita que el punto luminoso de la línea
 * sobresalga por debajo del círculo activo.
 */
.metro-linea-activa::after,
.metro-progreso-habilidades.animando
.metro-linea-activa::after {
  display: none !important;
}
</style>

<script>
  (function () {
    const barra = document.getElementById("metroProgresoHabilidades");
    if (!barra) return;

    function aplicarTraduccionMetro() {
      try {
        if (window.i18nJuego && typeof window.i18nJuego.aplicar === "function") {
          window.i18nJuego.aplicar();
        }
      } catch (e) {}
    }

    const pathname = window.location.pathname.toLowerCase();
    const puntos = Array.from(
      barra.querySelectorAll(".metro-punto")
    );

    const lineaBase = barra.querySelector(
      ".metro-linea-base"
    );

    const lineaActiva = document.getElementById(
      "metroLineaActiva"
    );

    /*
     * Algunas pantallas pueden indicar directamente qué habilidad
     * debe mostrarse activa mediante:
     *
     * <body data-metro-habilidad="comunicacion">
     *
     * La pantalla de Evaluación también se reconoce mediante su
     * clase peer-review-page, aunque la URL cambie.
     */
    const habilidadDeclarada = (
      document.body?.dataset?.metroHabilidad || ""
    )
      .trim()
      .toLowerCase();

    const habilidadForzada = habilidadDeclarada || (
      document.body?.classList.contains("peer-review-page")
        ? "comunicacion"
        : ""
    );

    const indicesHabilidades = {
      "trabajo-equipo": 0,
      "trabajo_equipo": 0,
      "empatia": 1,
      "creatividad": 2,
      "comunicacion": 3,
    };

    let activo = Object.prototype.hasOwnProperty.call(
      indicesHabilidades,
      habilidadForzada
    )
      ? indicesHabilidades[habilidadForzada]
      : -1;

    /*
     * Si la pantalla no forzó una habilidad, se identifica
     * utilizando el nombre de la ruta actual.
     */
    if (activo === -1) {
      puntos.forEach((punto, index) => {
        const fases = (punto.dataset.fases || "")
          .split(",")
          .map(fase => fase.trim().toLowerCase())
          .filter(Boolean);

        if (
          fases.some(fase =>
            pathname.includes(fase)
          )
        ) {
          activo = index;
        }
      });
    }

    if (activo === -1) {
      barra.style.display = "none";
      return;
    }

    const totalPuntos = puntos.length - 1;
    const porcentajeFinal = activo === 0 ? 0 : (activo / totalPuntos) * 100;

    const claveStorage = "metroProgresoHabilidadesActivo";
    const activoAnteriorGuardado = Number(sessionStorage.getItem(claveStorage));
    const tieneAnterior = Number.isFinite(activoAnteriorGuardado);
    const activoAnterior = tieneAnterior ? activoAnteriorGuardado : Math.max(0, activo - 1);

    const porcentajeInicial =
      activoAnterior <= 0 ? 0 : (activoAnterior / totalPuntos) * 100;

    const esTransicion = [
      "transicion",
      "transiciondesafio",
      "transicionempatia",
      "transicioncreatividad",
      "transicioncomunicacion"
    ].some(nombre => pathname.includes(nombre));

    const debeAnimar =
      esTransicion ||
      !tieneAnterior ||
      activoAnterior !== activo;

    puntos.forEach((punto, index) => {
      punto.classList.remove("activo", "completado", "animando");

      if (index < activo) {
        punto.classList.add("completado");
      }

      if (index === activo) {
        punto.classList.add("activo");
      }
    });

function aplicarProgreso(porcentaje, animar) {
  if (!lineaActiva || !lineaBase || !puntos.length) {
    return;
  }

  const circulos = puntos
    .map((punto) =>
      punto.querySelector(".metro-circulo")
    )
    .filter(Boolean);

  if (!circulos.length) {
    return;
  }

  const totalTramos = Math.max(
    circulos.length - 1,
    1
  );

  const porcentajeSeguro = Math.max(
    0,
    Math.min(
      100,
      Number(porcentaje) || 0
    )
  );

  const indiceObjetivo = Math.max(
    0,
    Math.min(
      circulos.length - 1,
      Math.round(
        (
          porcentajeSeguro /
          100
        ) * totalTramos
      )
    )
  );

  const primerPunto = puntos[0];
  const ultimoPunto =
    puntos[puntos.length - 1];

  const puntoObjetivo =
    puntos[indiceObjetivo];

  const primerCirculo = circulos[0];
  const ultimoCirculo =
    circulos[circulos.length - 1];

  const circuloObjetivo =
    circulos[indiceObjetivo];

  if (!animar) {
    lineaActiva.style.transition = "none";
  }

  /*
   * En pantallas pequeñas el mapa es horizontal.
   */
  if (window.innerWidth <= 700) {
    const inicioX =
      primerPunto.offsetLeft +
      primerCirculo.offsetLeft +
      primerCirculo.offsetWidth -
      2;

    const finalX =
      ultimoPunto.offsetLeft +
      ultimoCirculo.offsetLeft +
      2;

    const objetivoX =
      indiceObjetivo === 0
        ? inicioX
        : (
            puntoObjetivo.offsetLeft +
            circuloObjetivo.offsetLeft +
            2
          );

    const centroY =
      primerPunto.offsetTop +
      primerCirculo.offsetTop +
      primerCirculo.offsetHeight / 2;

    const grosor =
      window.innerWidth <= 420
        ? 5
        : 6;

    Object.assign(
      lineaBase.style,
      {
        top: `${centroY}px`,
        bottom: "auto",
        left: `${inicioX}px`,
        right: "auto",
        width: `${
          Math.max(
            0,
            finalX - inicioX
          )
        }px`,
        height: `${grosor}px`,
        transform: "translateY(-50%)",
      }
    );

    Object.assign(
      lineaActiva.style,
      {
        top: `${centroY}px`,
        bottom: "auto",
        left: `${inicioX}px`,
        right: "auto",
        width: `${
          Math.max(
            0,
            objetivoX - inicioX
          )
        }px`,
        height: `${grosor}px`,
        transform: "translateY(-50%)",
      }
    );
  } else {
    /*
     * En escritorio el mapa es vertical.
     *
     * La línea empieza dentro del borde inferior
     * del primer círculo.
     */
    const inicioY =
      primerPunto.offsetTop +
      primerCirculo.offsetTop +
      primerCirculo.offsetHeight -
      2;

    /*
     * La línea base termina dentro del borde
     * superior del último círculo.
     */
    const finalY =
      ultimoPunto.offsetTop +
      ultimoCirculo.offsetTop +
      2;

    /*
     * La línea activa termina dentro del borde
     * superior del círculo activo.
     */
    const objetivoY =
      indiceObjetivo === 0
        ? inicioY
        : (
            puntoObjetivo.offsetTop +
            circuloObjetivo.offsetTop +
            2
          );

    Object.assign(
      lineaBase.style,
      {
        top: `${inicioY}px`,
        bottom: "auto",
        left: "50%",
        right: "auto",
        width: "8px",
        height: `${
          Math.max(
            0,
            finalY - inicioY
          )
        }px`,
        transform: "translateX(-50%)",
      }
    );

    Object.assign(
      lineaActiva.style,
      {
        top: `${inicioY}px`,
        bottom: "auto",
        left: "50%",
        right: "auto",
        width: "8px",
        height: `${
          Math.max(
            0,
            objetivoY - inicioY
          )
        }px`,
        transform: "translateX(-50%)",
      }
    );
  }

  if (!animar) {
    void lineaActiva.offsetHeight;
    lineaActiva.style.transition = "";
  }
}

    if (debeAnimar) {
      barra.classList.add("animando");

      aplicarProgreso(porcentajeInicial, false);

      window.requestAnimationFrame(() => {
        window.requestAnimationFrame(() => {
          aplicarProgreso(porcentajeFinal, true);

          const puntoActivo = puntos[activo];
          if (puntoActivo) {
            puntoActivo.classList.add("animando");
          }
        });
      });

      window.setTimeout(() => {
        barra.classList.remove("animando");
        puntos.forEach(punto => punto.classList.remove("animando"));
      }, 1400);
    } else {
      aplicarProgreso(porcentajeFinal, false);
    }

    sessionStorage.setItem(claveStorage, String(activo));

    aplicarTraduccionMetro();

    window.addEventListener("resize", () => {
      aplicarProgreso(porcentajeFinal, false);
    });

    window.addEventListener("idiomaJuegoCambiado", aplicarTraduccionMetro);
  })();
</script>
