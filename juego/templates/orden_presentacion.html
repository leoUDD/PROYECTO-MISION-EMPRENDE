{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misión Emprende UDD — Orden de presentación</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/estilo_orden_presentacion.css' %}">
  <link rel="icon" href="{% url 'favicon' %}">

  <style>
    .acciones-listo{
      margin-top: 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }

    .btn-listo{
      border:none;
      border-radius:14px;
      padding:14px 28px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      background:#6c63ff;
      color:#fff;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
      transition:transform .15s ease, opacity .15s ease;
    }

    .btn-listo:hover{
      transform:translateY(-1px);
    }

    .btn-listo:disabled{
      opacity:.7;
      cursor:not-allowed;
      transform:none;
    }

    .estado-listos{
      margin:0;
      font-weight:700;
      color:#cfd8e3;
      text-align:center;
    }

    .panel-sorteo{
  position: relative;
  width: 100%;
  min-height: 560px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  padding: 28px 24px 20px;
  overflow:hidden;
}

    .flash-sorteo{
      position:absolute;
      inset:0;
      background:rgba(255,255,255,.97);
      opacity:0;
      pointer-events:none;
      z-index:20;
      transition:opacity .18s ease;
    }

    .flash-sorteo.visible{
      opacity:1;
    }

    .sorteo-stage{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      transition:opacity .3s ease, transform .3s ease;
    }

    .sorteo-stage.oculto{
      opacity:0;
      transform:translateY(-8px);
      pointer-events:none;
      height:0;
      overflow:hidden;
      margin:0;
      padding:0;
      min-height:0;
    }

    .resultado-stage{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      opacity:1;
      transition:opacity .3s ease, transform .3s ease;
    }

    .resultado-stage.oculto{
      opacity:0;
      transform:translateY(8px);
      pointer-events:none;
      height:0;
      overflow:hidden;
      margin:0;
      padding:0;
      min-height:0;
    }

.reel-wrap{
  position: relative;
  width: min(480px, 90vw);
  height: min(320px, 40vw);
  min-height: 260px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin: 8px auto 0;
  flex: 0 0 auto;
}

.reel-marco{
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 26px;
  border: 1.8px solid rgba(0,200,255,.50);
  background:
    radial-gradient(circle at 50% 50%, rgba(0,252,152,.06), transparent 60%),
    rgba(3,14,32,.62);
  box-shadow:
    inset 0 0 34px rgba(0,200,255,.14),
    0 0 30px rgba(0,200,255,.18),
    0 18px 40px rgba(0,0,0,.34);
  overflow: hidden;
  backdrop-filter: blur(5px);
  animation: reelMarcoPulso 2.6s ease-in-out infinite;
}

@keyframes reelMarcoPulso{
  0%, 100%{
    box-shadow:
      inset 0 0 34px rgba(0,200,255,.14),
      0 0 30px rgba(0,200,255,.18),
      0 18px 40px rgba(0,0,0,.34);
  }
  50%{
    box-shadow:
      inset 0 0 40px rgba(0,200,255,.22),
      0 0 42px rgba(0,200,255,.28),
      0 18px 40px rgba(0,0,0,.34);
  }
}

.reel-marco::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(3,14,32,.98) 0%, rgba(3,14,32,0) 26%, rgba(3,14,32,0) 74%, rgba(3,14,32,.98) 100%);
}

.reel-linea{
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  height: 68px;
  transform: translateY(-50%);
  border-top: 2px solid rgba(0,252,152,.85);
  border-bottom: 2px solid rgba(0,252,152,.85);
  background: rgba(0,252,152,.10);
  box-shadow:
    0 0 16px rgba(0,252,152,.45),
    inset 0 0 20px rgba(0,252,152,.12);
  pointer-events: none;
  z-index: 3;
}

.reel-linea::before,
.reel-linea::after{
  content:"▸";
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color: rgba(0,252,152,.85);
  font-size: 20px;
  text-shadow: 0 0 10px rgba(0,252,152,.6);
}

.reel-linea::before{ left:-4px; }
.reel-linea::after{ right:-4px; transform:translateY(-50%) scaleX(-1); }

.reel-lista{
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  will-change: transform;
}

.reel-item{
  height: 68px;
  min-height: 68px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: clamp(19px, 2.3vw, 26px);
  font-weight: 800;
  color: rgba(230,238,248,.42);
  text-align:center;
  padding: 0 22px;
  transition: color .2s ease, transform .2s ease, text-shadow .2s ease;
}

.reel-item.destacado{
  color: #fff;
  text-shadow: 0 0 16px rgba(0,252,152,.6);
  transform: scale(1.08);
}

.reel-item.ganador{
  color: var(--green-soft, #00fc98);
  text-shadow:
    0 0 10px rgba(0,252,152,.85),
    0 0 24px rgba(0,252,152,.55);
  transform: scale(1.1);
}

    .estado-sorteo{
      min-height: 34px;
      font-size: 1rem;
      font-weight: 800;
      color: #ffb15a;
      text-align:center;
      flex: 0 0 auto;
      margin-top: 2px;
    }

    .dots{
      display:flex;
      gap:8px;
      justify-content:center;
      align-items:center;
      min-height:18px;
      flex: 0 0 auto;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#6f89a7;
      opacity:.4;
    }

    .dot.active{
      background:#7ccfff;
      opacity:1;
      box-shadow:0 0 12px rgba(124,207,255,.7);
    }

    .lista-orden-bonita{
      width:min(100%, 520px);
      margin: 14px auto 0;
      display:flex;
      flex-direction:column;
      gap:12px;
      flex: 0 0 auto;
    }

    .fila-orden{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.06);
      color:#fff;
      animation: aparecerFila .35s ease;
    }

    @keyframes aparecerFila{
      from{ opacity:0; transform:translateY(10px); }
      to{ opacity:1; transform:translateY(0); }
    }

    .numero-orden{
      width:32px;
      height:32px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      background:linear-gradient(135deg,#ffba55,#d88a1e);
      color:#18263d;
      flex:0 0 32px;
    }

    .nombre-orden{
      font-weight:700;
      flex:1;
      text-align:left;
    }

    .primero-tag{
      font-size:.8rem;
      font-weight:800;
      color:#ffcb74;
      white-space:nowrap;
    }

    .oculto{
      display:none !important;
    }

    @media (max-width: 900px){
  .panel-sorteo{
    min-height: 500px;
    padding: 20px 16px 16px;
  }
}

@media (max-width: 640px){
  .panel-sorteo{
    min-height: 430px;
  }

  .reel-wrap{
    width: min(360px, 90vw);
    height: 260px;
    min-height: 220px;
  }

  .reel-item{
    height: 56px;
    min-height: 56px;
  }

  .reel-linea{
    height: 56px;
  }
}



  </style>
</head>
<body>
  {% include "atajos.html" %}
  <main class="contenedor">
    <section class="card">
      <h1 class="titulo" data-i18n="orden_presentacion_titulo">Orden de presentación</h1>
<p class="subtexto" data-i18n="orden_presentacion_subtexto">
  Se realizará el sorteo del orden en que cada equipo presentará su pitch.
</p>

      <div id="panelOrden" class="lista">
        <div class="flash-sorteo" id="flashSorteo"></div>

        <div class="panel-sorteo">
          <div id="sorteoStage" class="sorteo-stage">
            <div class="reel-wrap">
              <div class="reel-marco">
                <div class="reel-linea" aria-hidden="true"></div>
                <div id="reelLista" class="reel-lista"></div>
              </div>
            </div>

            <div id="estadoAnimacionSorteo" class="estado-sorteo" data-i18n="orden_presentacion_esperando">
  Esperando el sorteo
</div>

            <div id="dotsSorteo" class="dots">
              <span class="dot active"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>

          <div id="resultadoStage" class="resultado-stage oculto">
            <div id="listaOrdenBonita" class="lista-orden-bonita"></div>
          </div>
        </div>
      </div>

      <div class="estado-fase" id="estadoFaseTexto"></div>

      <div class="acciones-listo" id="accionesListoOrden">
        <button id="btnOrdenListo" class="btn-listo" data-i18n="orden_presentacion_boton">¡Estoy listo!</button>
        <p id="ordenListoEstado" class="estado-listos">0/0 grupos listos</p>
      </div>
    </section>
  </main>

  <audio id="audioSorteoAgitar" preload="auto">
    <source src="{% static 'sounds/ruleta.mp3' %}" type="audio/mpeg">
  </audio>
  <audio id="audioSorteoReveal" preload="auto">
    <source src="{% static 'sounds/sorteo_reveal.mp3' %}" type="audio/mpeg">
  </audio>

  <script>
    const sesionId = "{{ grupo.sesion.idsesion }}";
    const grupoId = "{{ grupo.idgrupo }}";
    const btnOrdenListo = document.getElementById("btnOrdenListo");
    const ordenListoEstado = document.getElementById("ordenListoEstado");
    const accionesListoOrden = document.getElementById("accionesListoOrden");
    const reelListaEl = document.getElementById("reelLista");
    const estadoAnimacionSorteo = document.getElementById("estadoAnimacionSorteo");
    const dotsSorteo = document.getElementById("dotsSorteo");
    const listaOrdenBonita = document.getElementById("listaOrdenBonita");
    const flashSorteo = document.getElementById("flashSorteo");
    const sorteoStage = document.getElementById("sorteoStage");
    const resultadoStage = document.getElementById("resultadoStage");
    const audioSorteoAgitar = document.getElementById("audioSorteoAgitar");
    const audioSorteoReveal = document.getElementById("audioSorteoReveal");

    function tOrden(clave, fallback) {
  try {
    const idioma = window.i18nJuego?.obtenerIdioma?.() || "es";
    return window.i18nJuego?.traducciones?.[idioma]?.[clave] || fallback;
  } catch (e) {
    return fallback;
  }
}

let ordenSorteadoPrevio = false;
    let animacionActiva = false;
    let ultimoOrdenRenderizado = "";

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.startsWith(name + "=")) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    function reproducirAudio(el) {
      if (!el) return;
      try {
        el.currentTime = 0;
        el.play().catch(() => {});
      } catch (_) {}
    }

    function setDots(activo) {
      if (!dotsSorteo) return;
      const dots = dotsSorteo.querySelectorAll(".dot");
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === activo);
      });
    }

    function mostrarSoloAnimacion() {
      if (sorteoStage) sorteoStage.classList.remove("oculto");
      if (resultadoStage) resultadoStage.classList.add("oculto");
    }

    function mostrarSoloResultado() {
      if (sorteoStage) sorteoStage.classList.add("oculto");
      if (resultadoStage) resultadoStage.classList.remove("oculto");
    }

    function resetVisualSorteo() {
      if (reelListaEl) {
        reelListaEl.style.transition = "none";
        reelListaEl.style.transform = "translateY(0px)";
        reelListaEl.innerHTML = "";
      }
      if (flashSorteo) flashSorteo.classList.remove("visible");
      if (listaOrdenBonita) {
        listaOrdenBonita.innerHTML = "";
      }
      if (estadoAnimacionSorteo) estadoAnimacionSorteo.textContent = tOrden("orden_presentacion_esperando", "Esperando el sorteo");
      setDots(0);
      ultimoOrdenRenderizado = "";
      mostrarSoloAnimacion();
    }

    function serializarOrden(ordenPitch, grupoActual) {
      return JSON.stringify({
        ordenPitch: ordenPitch || [],
        grupoActualId: grupoActual ? Number(grupoActual.id) : null
      });
    }

    function renderOrdenBonito(ordenPitch, grupoActual) {
      if (!listaOrdenBonita) return;

      const firma = serializarOrden(ordenPitch, grupoActual);
      if (firma === ultimoOrdenRenderizado) return;

      listaOrdenBonita.innerHTML = (ordenPitch || []).map(item => {
        const esActual = grupoActual && Number(grupoActual.id) === Number(item.id);
        return `
          <div class="fila-orden">
            <div class="numero-orden">${item.orden}</div>
            <div class="nombre-orden">${item.nombre}</div>
            ${esActual ? `<div class="primero-tag">${tOrden("orden_presentacion_primero_tag", "primer turno")}</div>` : ``}
          </div>
        `;
      }).join("");

      ultimoOrdenRenderizado = firma;
    }

    function construirCarrete(ordenPitch) {
      const nombres = (ordenPitch || []).map(item => item.nombre);
      if (!nombres.length) return { lista: [], indiceFinal: 0 };

      const primero = (ordenPitch || []).find(item => Number(item.orden) === 1);
      const indiceObjetivo = primero ? Math.max(0, nombres.indexOf(primero.nombre)) : 0;

      const VUELTAS = 6;
      const lista = [];
      for (let v = 0; v < VUELTAS; v++) {
        lista.push(...nombres);
      }
      const indiceFinal = (VUELTAS - 1) * nombres.length + indiceObjetivo;

      return { lista, indiceFinal };
    }

    function mostrarAnimacionSorteo(ordenPitch, grupoActual) {
      if (animacionActiva) return;
      animacionActiva = true;

      mostrarSoloAnimacion();

      if (listaOrdenBonita) {
        listaOrdenBonita.innerHTML = "";
      }

      if (estadoAnimacionSorteo) estadoAnimacionSorteo.textContent = tOrden("orden_presentacion_sorteando", "Sorteando...");
      setDots(1);

      const { lista, indiceFinal } = construirCarrete(ordenPitch);

      if (reelListaEl) {
        reelListaEl.innerHTML = lista.map(nombre => `<div class="reel-item">${nombre}</div>`).join("");
      }

      const primerItem = reelListaEl ? reelListaEl.querySelector(".reel-item") : null;
      const ALTURA_ITEM = primerItem ? primerItem.getBoundingClientRect().height : 68;

      if (reelListaEl) {
        reelListaEl.style.transition = "none";
        reelListaEl.style.transform = `translateY(-${ALTURA_ITEM / 2}px)`;
      }

      reproducirAudio(audioSorteoAgitar);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (reelListaEl) {
            const destino = (indiceFinal * ALTURA_ITEM) + (ALTURA_ITEM / 2);
            reelListaEl.style.transition = "transform 3.6s cubic-bezier(.12,.72,.18,1)";
            reelListaEl.style.transform = `translateY(-${destino}px)`;
          }
        });
      });

      setTimeout(() => {
        if (estadoAnimacionSorteo) estadoAnimacionSorteo.textContent = tOrden("orden_presentacion_primero", "Y el primero es...");
        setDots(2);
      }, 2600);

      setTimeout(() => {
        if (audioSorteoAgitar) { try { audioSorteoAgitar.pause(); } catch(_) {} }
        if (flashSorteo) flashSorteo.classList.add("visible");
        reproducirAudio(audioSorteoReveal);
        if (reelListaEl) {
          const items = reelListaEl.querySelectorAll(".reel-item");
          if (items[indiceFinal]) items[indiceFinal].classList.add("ganador");
        }
      }, 3700);

      setTimeout(() => {
        if (flashSorteo) flashSorteo.classList.remove("visible");
        renderOrdenBonito(ordenPitch, grupoActual);
        mostrarSoloResultado();
        animacionActiva = false;
      }, 4350);
    }

    function renderEstadoFase(data) {
      const estado = document.getElementById("estadoFaseTexto");
      if (!estado) return;

      if (data.faseActual === "f4_orden_pitch") {
        if (!data.ordenSorteado) {
          estado.textContent = tOrden("orden_presentacion_info_pre_sorteo", "Cuando todos los equipos estén listos, se realizará el sorteo del orden de presentación.");
        } else {
          estado.textContent = tOrden("orden_presentacion_info_sorteado", "El orden ya fue sorteado. Cuando todos los equipos estén listos nuevamente, comenzará la ronda de presentaciones.");
        }

        if (accionesListoOrden) {
          accionesListoOrden.style.display = "flex";
        }

        if (ordenListoEstado) {
          ordenListoEstado.textContent = `${data.gruposListosF4Orden || 0}/${data.totalGrupos || 0} ${tOrden("orden_presentacion_grupos_listos", "grupos listos")}`;
        }

        const miGrupo = (data.grupos || []).find(g => Number(g.id) === Number(grupoId));
        const yaListo = miGrupo?.listoF4Orden;

        if (btnOrdenListo) {
          btnOrdenListo.disabled = !!yaListo;
          btnOrdenListo.textContent = yaListo
            ? tOrden("orden_presentacion_boton_listo", "Listo ✓")
            : tOrden("orden_presentacion_boton", "¡Estoy listo!");
        }
      } else if (data.faseActual === "f4_presentacion_pitch") {
        estado.textContent = tOrden("orden_presentacion_info_presentacion", "La presentación ha comenzado.");

        if (accionesListoOrden) {
          accionesListoOrden.style.display = "none";
        }
      } else {
        estado.textContent = "";
        if (accionesListoOrden) {
          accionesListoOrden.style.display = "none";
        }
      }
    }

    async function marcarListoOrden() {
      try {
        const resp = await fetch(`/grupo/${grupoId}/listo/`, {
          method: "POST",
          headers: {
            "X-CSRFToken": getCookie("csrftoken"),
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({})
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          console.error("Error al marcar listo:", data);
          return;
        }

        await cargarOrden();
      } catch (error) {
        console.error("Error marcando listo en orden:", error);
      }
    }

    async function cargarOrden() {
      try {
        const res = await fetch(`/sesion/${sesionId}/estado-presentacion/`, {
          credentials: "same-origin",
          cache: "no-store"
        });

        const data = await res.json();

        if (!res.ok || !data.ok) return;

        if (data.faseActual === "f4_presentacion_pitch") {
          window.location.replace("{% url 'presentar_pitch' %}");
          return;
        }

        if (data.faseActual && data.faseActual !== "f4_orden_pitch") {
          if (data.rutaAlumno) {
            window.location.replace(data.rutaAlumno);
            return;
          }
        }

        if (!data.ordenSorteado) {
          resetVisualSorteo();
          ordenSorteadoPrevio = false;
        }

        if (data.ordenSorteado && !ordenSorteadoPrevio && data.ordenPitch && data.ordenPitch.length) {
          ordenSorteadoPrevio = true;
          mostrarAnimacionSorteo(data.ordenPitch, data.grupoActual);
          renderEstadoFase(data);
          return;
        }

        ordenSorteadoPrevio = !!data.ordenSorteado;

        if (data.ordenSorteado && data.ordenPitch && data.ordenPitch.length && !animacionActiva) {
          renderOrdenBonito(data.ordenPitch, data.grupoActual);
          mostrarSoloResultado();
        }

        renderEstadoFase(data);
      } catch (error) {
        console.error("Error cargando orden:", error);
      }
    }

    if (btnOrdenListo) {
      btnOrdenListo.addEventListener("click", marcarListoOrden);
    }

    document.addEventListener("DOMContentLoaded", cargarOrden);
    setInterval(cargarOrden, 1500);
  </script>

  {% include "includes/sincronizacion_fase.html" %}
</body>
